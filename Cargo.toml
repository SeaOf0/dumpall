[package]
name = "dumpall"
version = "1.0.0"
edition = "2021"
description = "Read-only Web intrusion incident-response triage helper"
publish = false

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[features]
default = []
geoip = ["dep:maxminddb"]
yara = []
binary-evtx = ["dep:evtx"]

[dependencies]
anyhow = "=1.0.86"
rust_xlsxwriter = { version = "=0.98.2", default-features = false, features = ["constant_memory"] }
evtx = { version = "=0.8.5", optional = true, default-features = false, features = [] }
clap = { version = "=4.5.4", features = ["derive"] }
csv = "=1.3.0"
crc32fast = "=1.5.0"
flate2 = "=1.1.9"
indexmap = "=2.2.6"
maxminddb = { version = "=0.28.1", optional = true }
regex = "=1.10.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
thiserror = "=1.0.61"
time = { version = "=0.3.36", features = ["formatting", "local-offset", "macros", "parsing"] }
toml = "=0.8.12"
tracing = "0.1"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
] }
